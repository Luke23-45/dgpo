# FILE: configs/train_rlaif_config.yaml
# RLAIF (RL from AI Feedback) Training Configuration
# On-Policy RL training where policy controls the robot and learns from expert feedback

seed: 42

# --- BC Checkpoint (Pre-trained SemanticPlanner) ---
bc_checkpoint: "/content/drive/MyDrive/pda/bc/bc_backup_epoch_088.ckpt"

freeze_vision: true  # Freeze vision backbone to save compute

# --- Model Configuration ---
model:
  proprio_dim: 22
  chunk_size: 10

# --- Value Network ---
value_net:
  hidden_dim: 256

# --- Environment ---
environment:
  xml_path: "envs/panda_pick_place.xml"
  urdf_path: "urdf/panda_mujoco_kinematics.urdf"

# --- Expert Configuration (Used as Reward Model) ---
expert:
  object_size: [0.04, 0.04, 0.04]  # Cube dimensions
  grasp_width: 0.6  # Normalized gripper width for grasp
  hover_height: 0.15
  grasp_offset_z: 0.025

# --- Reward Configuration ---
reward:
  # Task reward
  w_dist: 1.0  # Weight for distance-to-goal penalty
  
  # Expert alignment reward (DENSE per-step)
  w_div: 1.0  # Weight for divergence from expert target
  position_weight: 1.0  # Position error weight in divergence
  orientation_weight: 0.1  # Orientation error weight in divergence
  
  # Success bonus (sparse, terminal)
  success_bonus: 100.0

# --- PPO Hyperparameters ---
ppo:
  gamma: 0.99  # Discount factor
  gae_lambda: 0.95  # GAE lambda
  epochs: 4  # Number of PPO epochs per iteration
  batch_size: 64  # Mini-batch size
  value_coef: 0.5  # Value loss coefficient
  max_grad_norm: 0.5  # Gradient clipping
  temperature: 1.0  # Temperature for advantage weighting
  clip_range: 0.2  # PPO clip range (not used in continuous action variant)
  entropy_coef: 0.01  # Entropy bonus (for exploration)

# --- Optimizer ---
optimizer:
  policy_lr: 1.0e-5  # Lower LR for fine-tuning
  value_lr: 1.0e-4

# --- Training Loop ---
training:
  total_iterations: 200
  steps_per_iter: 2048  # Steps collected per iteration (on-policy)
  max_episode_steps: 300  # Terminate episodes after this many steps
  divergence_threshold: 0.15  # Terminate if policy diverges > 15cm from expert

# --- Logging Configuration ---
logging:
  log_dir: "outputs/rlaif_runs/"  # Base directory for all outputs
  csv_log_name: "training_metrics.csv"  # CSV metrics filename
  use_tensorboard: true  # Enable TensorBoard logging
  log_every_n_iters: 1  # How often to log (every N iterations)

# --- Checkpoint & Resume Configuration ---
checkpoint:
  save_dir: "outputs/rlaif_runs/checkpoints"  # Directory for regular checkpoints
  save_freq: 10  # Save checkpoint every N iterations
  backup_dir: "outputs/rlaif_runs/backups"  # Directory for failsafe backups
  backup_freq: 3  # Save backup every N iterations
  backups_to_keep: 3  # Number of old backups to retain
  resume_from: null  # Path to checkpoint to resume from (set to .pt path)
