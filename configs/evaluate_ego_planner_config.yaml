# FILE: configs/evaluate_ego_planner_config.yaml
# SOTA Hydra Configuration for the Ego-Planner Evaluation Script

# --- Top-Level Settings ---
seed: 43
# The .ckpt file from your training run. MUST be provided, e.g., via command line:
# `python scripts/evaluate_ego_planner.py checkpoint_path=/path/to/your/model.ckpt`
checkpoint_path: "C:/Users/Hellx/Documents/Programming/python/Project/redhot/notes/checkpoints/backup_epoch_80.ckpt"

device: "cpu"


output_video: "video/ego/evaluation_video.mp4"

# Number of episodes to run for the evaluation.
num_episodes: 1

# --- Evaluation Mode ---
# The primary mode of operation.
# Options: "all", "closed_loop", "forced_trajectory", "open_loop"
evaluation_mode: "closed_loop"

video_fps: 15

# --- Dataset Configuration ---
dataset:
  # Path to the .lmdb file for evaluation
  path: "PATH/TO/YOUR/validation_dataset.lmdb"

# --- SOTA: Model, Scheduler, and Env Configs ---
# These sections explicitly define the architecture, ensuring the script can
# perfectly reconstruct all components without relying on the checkpoint.

# This section MUST match the configuration used for training the loaded checkpoint.
model:
  action_dim: 7
  proprio_dim: 22
  action_horizon: 8
  obs_horizon: 2
  vision_backbone_model: "google/siglip-base-patch16-224"
  vision_feature_dim: 768
  fusion_transformer_layers: 4
  fusion_transformer_heads: 8
  resnet_feature_dim: 256
  pilot_d_model: 512
  denoiser_layers: 6
  denoiser_heads: 8

# This section MUST match the scheduler config from training.
scheduler:
  beta_schedule: "cosine"
  beta_start: 0.0001
  beta_end: 0.02
  timesteps: 100

# Environment configuration for online rollouts
env:
  xml_path: "envs/panda_pick_place.xml"

# --- Inference & Rollout Parameters ---
inference:
  sampling_steps: 20
  guidance_scale_plan: 2.5
  guidance_scale_obs: 2.5

rollout:
  # The list of specific episode indices from the dataset to evaluate.
  # If empty or null, a range of episodes will be evaluated up to `max_episodes_to_eval`.
  # Example: [0, 5, 10]
  episode_indices: []
  max_episodes_to_eval: 5  # Used if `episode_indices` is empty
  max_steps: 400           # Max steps per closed-loop rollout



