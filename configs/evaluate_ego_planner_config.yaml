# The definitive, SOTA Hydra configuration for EVALUATING the Ego-Planner.

# --- Required Paths ---
# You MUST provide the path to your trained model checkpoint.
checkpoint_path: "C:/Users/Hellx/Documents/Programming/python/Project/redhot/notes/checkpoints/v1/backup_epoch_5.ckpt"
train_config_path: "C:/Users/Hellx/Documents/Programming/python/Project/redhot/configs/train_ego_planner_config.yaml"

# --- Output Settings ---
output_video: "ego_planner_phase_aware_eval.mp4"

# --- Evaluation Parameters ---
num_episodes: 1 # How many episodes to run.
seed: 44         # The master seed for reproducibility.

# If true, the same scene will be used for all episodes (good for debugging).
# If false, each episode will have a different scene (good for testing generalization).
eval_static_scene: true

# --- Inference Parameters (must match the model's capabilities) ---
inference:
  # Number of DDIM steps for the diffusion model.
  sampling_steps: 30
  
  # Classifier-Free Guidance scales.
  guidance_scale_plan: 7.5
  guidance_scale_obs: 1.5

# --- Logging (Optional) ---
# (You can add CSV logging options here if desired)

# Hydra specific settings for clean execution
hydra:
  run:
    dir: ./outputs/evaluation/${now:%Y-%m-%d}/${now:%H-%M-%S}