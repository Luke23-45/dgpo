# ---
# The Definitive, State-of-the-Art Hydra Configuration for UHP Evaluation
#
# This file controls the behavior of the `evaluate/evaluate_uhp.py` script.
# It is designed to be clear, robust, and easy to use.
#
# Primary Usage:
#   python -m evaluate.evaluate_uhp checkpoint_path=/path/to/your/model.ckpt
# ---

# --- Core Evaluation Parameters ---

# !!! IMPORTANT !!!
# This is the path to the PyTorch Lightning checkpoint you want to evaluate.
# It MUST be provided, typically via the command line. The '???' is a
# Hydra placeholder that will raise an error if it's not overridden.
checkpoint_path: "C:/Users/Hellx/Documents/Programming/python/Project/redhot/notes/checkpoints/v1/backup_epoch_31.ckpt"

# The path where the output evaluation video will be saved.
output_video: "evaluation_uhp1.mp4"

# The master seed for the evaluation run to ensure reproducibility.
seed: 43

# The number of evaluation episodes to run and record.
num_episodes: 1


# ==============================================================================
# Inference Behavior Configuration
# ==============================================================================
inference:
  # The number of denoising steps for the Executor's diffusion model.
  # A higher number can lead to slightly better action quality at the cost of
  # slower inference. 20 is a strong, fast default for DDIM.
  inference_steps: 20


logging:
  # --- Video Logging ---
  # Set to true to save a diagnostic video with heatmap overlays.
  enable_video: true
  video_output_path: "evaluation_uhp.mp4"

  # --- CSV Diagnostic Logging ---
  # Set to true to save a detailed, per-timestep CSV for deep analysis.
  enable_csv_logging: true
  csv_output_path: "evaluation_diagnostics.csv"