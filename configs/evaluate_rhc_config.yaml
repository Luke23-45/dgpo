# FILE: configs/evaluate_rhc_config.yaml
defaults:
  - override hydra/launcher: basic

# --- Model & Environment Configuration ---
checkpoint_path: "/content/drive/MyDrive/pda/models/v1/backups/backup_epoch_043.ckpt"
num_episodes: 50
max_steps: 200 # Max steps per episode (e.g., 10 seconds at 20Hz)
seed: 42
success_threshold: 0.05 # 5 cm distance to goal for success

# --- RHC & Smoothing Parameters ---
# The model predicts K actions (e.g., 10). We execute N.
# N=1 (Execution Horizon): Standard for pure RHC evaluation.
# N=K/2 (Execution Horizon): Can be used for higher throughput but less reactivity.
execution_horizon: 1 
ema_alpha: 0.95 # Smoothing factor for the executed action (0.95 is light smoothing)

# --- Environment Details (Must match training) ---
env:
  xml_path: "envs/panda_pick_place.xml"
  action_scaling_factor: 0.5