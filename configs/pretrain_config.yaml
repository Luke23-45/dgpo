# ============================================================
# CONFIG: Pretraining Diffusion Policy (2025 Edition)
# ============================================================

# ---------------------------
# General / Reproducibility
# ---------------------------
seed: 42
device: cpu              # UPDATED: Set to 'cpu' as per your setup. Change to 'cuda' when on GPU.
use_wandb: false         # true to enable W&B logging
wandb_project: "diffusion_pretrain"
output_dir: runs/diffusion_pretrain_final_run # UPDATED: New run name to avoid overwriting

# ---------------------------
# Dataset
# ---------------------------
dataset:
  path: "C:/Users/Hellx/Documents/Programming/python/Project/dgpo/data/demos/expert_expert_run_v1_20k_samples_2939e707515a1a6963254bc55001a1b0.lmdb" # UPDATED: Using your specific dataset path
  batch_size: 32           # KEPT: 32 is a good value for CPU training with this model.
  num_workers: 0           # UPDATED: MUST be 0 for your CPU setup to avoid memory errors.

# ---------------------------
# Model Architecture
# ---------------------------
model:
  # --- Temporal settings ---
  observation_horizon: 2     # UPDATED: We used 2 in the last working version for faster iteration.
  action_horizon: 8          # KEPT: This is the standard future prediction window.

  # --- Action / Observation dims ---
  action_dim: 8              # KEPT: Correct for the Panda robot (7-DoF arm + 1-DoF gripper).
  proprio_dim: 22            # KEPT: Correct for the proprioceptive state from PandaEnv.
  vision_features: 128       # UPDATED: We determined a larger feature space was necessary.

  # --- Denoiser Network ---
  d_model: 256               # KEPT: This is a reasonable Transformer embedding size.
  denoiser_layers: 6         # UPDATED: We increased this from 4 to 6 for more capacity.
  denoiser_heads: 8          # KEPT: 8 is a standard number of attention heads.
  denoiser_dropout: 0.1      # KEPT: Standard dropout value.

# ---------------------------
# Diffusion Scheduler
# ---------------------------
scheduler:
  type: cosine               # KEPT: Cosine schedule is generally preferred.
  T: 100                     # UPDATED: We used 100 timesteps, which is standard and effective.
  beta_start: 1.0e-4         # KEPT: Standard value.
  beta_end: 0.02             # KEPT: Standard value.

# ---------------------------
# Training Parameters
# ---------------------------
training:
  epochs: 500                # UPDATED: A full run requires many epochs.
  lr: 1.0e-4                 # KEPT: This is a good, safe learning rate to start with.
  weight_decay: 1.0e-6       # KEPT: Standard small value for regularization.
  ema_decay: 0.999           # UPDATED: We used 0.999, a common and effective value.
  amp: false                 # UPDATED: MUST be false for CPU training.
  log_interval_steps: 10     # UPDATED: More frequent logging is helpful for quick tests.
  save_interval_epochs: 50   # UPDATED: Save less frequently during a long run.
  grad_clip: 1.0             # KEPT: Gradient clipping is a good practice for stability.

# ============================================================
# Optional Notes:
# - This configuration is now aligned with the final, vision-aware
#   `DiffusionPolicy` and the `pretrain_diffusion.py` script.
# ============================================================