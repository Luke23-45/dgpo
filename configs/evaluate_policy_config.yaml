# FILE: configs/evaluate_policy_config.yaml

# Hydra settings
hydra:
  run:
    dir: outputs/evaluations/${now:%Y-%m-%d}/${now:%H-%M-%S}

# ===================================================================
# 1. CORE SETTINGS
# ===================================================================
# CRITICAL: Path to the trained model checkpoint (.pth file) to evaluate.
# This should be overridden on the command line, e.g.,
# python -m scripts.evaluate_policy ckpt_path=path/to/your/best.pth
ckpt_path: "C:/Users/Hellx/Documents/Programming/python/Project/dgpo/outputs/diffusion_pretrain/v1/2025-10-25/00-16-18/checkpoints/backup/backup_epoch_19.pth"

seed: 42
device: "cpu" # 'cuda' for GPU

# ===================================================================
# 2. EVALUATION MODES
# ===================================================================
# Set these to true/false to enable/disable different evaluation types.
do_offline_eval: true
do_online_eval: true

# ===================================================================
# 3. EVALUATION PARAMETERS
# ===================================================================
eval:
  batch_size: 32
  
  # --- Sampling parameters (must match what you expect for good performance) ---
  sampling_steps: 50
  guidance_scale: 1.5

  # --- Rollout parameters ---
  n_rollouts: 2 # Number of episodes to run in the simulator
  max_rollout_steps: 500 # Max steps per episode

# ===================================================================
# 4. REQUIRED PATHS & CONFIGS FOR REBUILDING
# ===================================================================
# This dataset path should point to your validation or test set for offline eval.
dataset:
  val_path: "C:/Users/Hellx/Documents/Programming/python/Project/dgpo/data/validation/sota_dataset/expert_validation_run_99914b93.lmdb"

# This environment config is needed for online rollouts.
# It MUST match the environment the policy was trained for.
environment:
  xml_path: "envs/panda_pick_place.xml"

