defaults:
  - _self_

# Global Seed
seed: 100

# --- Paths ---
# Point to your best Pre-Trained Checkpoint
model_checkpoint: "/content/drive/MyDrive/pda/models/v1/backups/backup_epoch_031.ckpt" 

# The original Expert data (Anchor)
static_dataset_path: "/content/drive/MyDrive/pda/data/training_ready/training_data.lmdb"

# Physics Asset
ik_solver_path: "urdf/panda_mujoco_kinematics.urdf"

# --- Model Architecture (CRITICAL: Must match pre-training) ---
model:
  proprio_dim: 22       
  num_task_phases: 5
  
  vision_backbone_model: "google/siglip-base-patch16-224"
  vision_feature_dim: 768
  
  fusion_transformer_layers: 4
  fusion_transformer_heads: 8
  dim_feedforward_ratio: 4
  dropout: 0.1
  
  # v9.0 Specific
  chunk_size: 10  
  
  # Legacy params required by config parser
  phase_dropout_prob: 0.3 
  obs_horizon: 1 

# --- DAgger Orchestration Settings ---
dagger:
  num_rounds: 5                 # Number of Rollout -> Train cycles
  
  # Interaction Phase
  rollout_episodes_per_round: 10 
  
  # Memory
  buffer_capacity: 10000         
  
  # Data Mixing
  mix_ratio: 0.3                 

  # Advantage Injection
  correction_advantage: 10.0     

  # Update Phase
  epochs_per_round: 5            

# --- Training Hyperparameters ---
training:
  batch_size: 64                 
  num_workers: 2                 
  
  # AWR Parameters
  awr_temperature: 5.0
  awr_max_weight: 20.0
  
  loss_weights:
    lambda_gripper: 2.0
    lambda_phase: 0.1

  # Required by Trainer (even if overridden by DAgger loop)
  val_batch_size: 64
  check_val_every_n_epoch: 1
  max_epochs: 2 
  gradient_clip_val: 1.0

# --- Optimizer (Fine-Tuning Settings) ---
optimizer:
  # Learning Rate is 10x lower than pre-training (1e-4 -> 1e-5)
  lr: 1e-5
  weight_decay: 1e-6
  min_lr: 1e-7
  warmup_percentage: 0.0 # Overridden to 0.0 in script, but kept here for safety

# --- Dataset Config (For Noise/Augmentation) ---
dataset:
  train_path: ${static_dataset_path} # Reference the var above
  val_path: ${static_dataset_path}
  use_aug: true
  proprio_noise: 0.02
  num_workers: 0

# --- Logging ---
logging:
  use_wandb: true
  wandb_project: "AWSP-DAgger"
  wandb_mode: "offline"
  run_name: "dagger_alignment_v1"