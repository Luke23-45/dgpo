# ---
# The Definitive, State-of-the-Art Hydra Configuration for the UHP v2.0
#
# This file provides a single, human-readable source of truth for every
# hyperparameter and setting in the UHP training pipeline. It is structured
# to be clear, self-documenting, and easily modifiable for experiments.
# ---

# Top-level seed for reproducibility.
seed: 42

# Environment configuration, used for extracting kinematic limits.
env:
  xml_path: "envs/panda_pick_place.xml"

# ==============================================================================
# Model Configuration: Defines the UHP architecture.
# ==============================================================================
model:
  # Configuration for the Sequencer (high-level planner).
  sequencer_cfg:
    vision_backbone_model: "google/siglip-base-patch16-224"
    num_task_phases: 5  # Corresponds to the 0-4 phases defined in the dataset.
    fusion_transformer_layers: 4
    fusion_transformer_heads: 8
    subgoal_dim: 768  # The dimension of the dense command vector.

  # Configuration for the Executor (low-level diffusion policy).
  executor_cfg:
    # 7 (arm qpos) + 7 (arm qvel) + 2 (touch) + 6 (force) = 22
    proprio_dim: 22
    action_dim: 8     # 7 (arm) + 1 (gripper)
    action_horizon: 8 # Length of the predicted action sequence.
    obs_horizon: 2    # Number of past observations to use as context.
    # CRITICAL: This MUST match the subgoal_dim from the sequencer_cfg.
    subgoal_dim: 768
    pilot_hidden_dim: 512 # Main hidden dimension of the denoising transformer.
    resnet_feature_dim: 256 # Output dimension of the ResNet encoders.
    denoiser_layers: 6
    denoiser_heads: 8

# ==============================================================================
# Dataset Configuration
# ==============================================================================
dataset:
  # !!! IMPORTANT: You MUST replace these with the correct paths to your datasets. !!!
  train_path: "/content/drive/MyDrive/pda/data/validation/validation_dataset.lmdb"
  val_path: "/content/drive/MyDrive/pda/data/validation/validation_dataset.lmdb"
  num_workers: 1 # Adjust based on the number of CPU cores available.

# ==============================================================================
# Training Configuration
# ==============================================================================
training:
  batch_size: 32
  val_batch_size: 16
  ema_decay: 0.999 # Decay rate for the Exponential Moving Average model.


  # The metric to monitor for saving the best checkpoints.
  # 'val/loss_action_raw' is the primary indicator of policy performance.
  checkpoint_monitor: "val/loss_action_raw"
  backup_every_n_epochs: 8
  save_top_k: 3 # Save the top 3 best models.

  # Path to a checkpoint to resume training from. `null` for a fresh run.
  resume_from_checkpoint: null

  # SOTA Technique: Use Stochastic Weight Averaging for potentially better generalization.
  use_swa: false
  swa_lrs: 1.0e-4

  # --- CRITICAL: Hybrid Loss Weights ---
  loss_weights:
    # Weight for the auxiliary heatmap loss.
    # This should be < 1.0, as it's a regularizer. The primary driver of
    # behavior should be the action loss. 0.1 is a strong default.
    lambda_heatmap: 0.1

# ==============================================================================
# Optimizer and Scheduler Configuration
# ==============================================================================
optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  warmup_percentage: 0.1 # Use 10% of total steps for learning rate warmup.

# Configuration for the DDPM/DDIM Noise Scheduler.
scheduler:
  timesteps: 100
  beta_schedule: "squaredcos_cap_v2"
  beta_start: 0.0001
  beta_end: 0.02

# ==============================================================================
# Validation Configuration
# ==============================================================================
validation:
  # Frequency for the "slow path" validation (qualitative logging).
  # Runs every N epochs to avoid slowing down training too much.
  run_qualitative_every_n_epoch: 60

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging:
  use_wandb: true
  # Set to 'offline' if running without an internet connection.
  wandb_mode: "offline"
  # !!! IMPORTANT: Set your Weights & Biases project name. !!!
  wandb_project: "UHP_Panda_Project"
  # Let Hydra name the run by default for better organization.
  wandb_run_name: null
  # Frequency to log model gradients.
  log_grad_freq: 100
  progress_bar_refresh_rate: 10

# ==============================================================================
# PyTorch Lightning Trainer Configuration
#
# This section unpacks directly into the pl.Trainer, controlling hardware,
# precision, duration, and other training loop settings.
# ==============================================================================
trainer:
  accelerator: "auto"
  devices: "auto"
  check_val_every_n_epoch: 40
  max_epochs: 500
  # Use 16-bit mixed precision for faster training and lower memory usage.
  precision: "16-mixed"
  log_every_n_steps: 10
  # Add gradient clipping for training stability.
  gradient_clip_val: 1.0