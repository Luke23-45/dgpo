# FILE: configs/finetune_rl_config.yaml
#
# Definitive, Production-Grade Configuration for train_rl.py
# This orchestrates Phase 3: RL Fine-tuning with TQC + HER + AWBC.
# ---

# ===================================================================
# 1. RUN MANAGEMENT & OUTPUT
# ===================================================================
# A unique name for this fine-tuning run.
run_name: "diffusion_tqc_her_finetune_v1"

# Directory where all artifacts (checkpoints, logs, final model) will be saved.
output_dir: "trained_models/rl_finetuned"

# Master seed for reproducibility of the RL training process.
seed: 42

# Device to train on. 'cuda' is strongly recommended for RL. 'auto' will try to use cuda if available.
device: cpu


# ===================================================================
# 2. REQUIRED FILE PATHS
# ===================================================================
# Path to the pre-trained diffusion policy weights (.pth file).
# This is the `best_ckpt_epochXX.pt` file generated by `pretrain_diffusion.py`.
# CRITICAL: UPDATE THIS PATH.
pretrained_policy_path: "runs/diffusion_pretrain/run_1/ckpt_epoch200.pt"

# Path to the offline expert dataset (.lmdb or .pkl file).
# This is used for the auxiliary Advantage-Weighted BC loss.
# CRITICAL: UPDATE THIS PATH.
demo_path: "data/demos/expert_expert_run_v1_20k_samples_2939e707515a1a6963254bc55001a1b0.lmdb"


# ===================================================================
# 3. ENVIRONMENT CONFIGURATION
# ===================================================================
# Paths to the core simulation assets.
urdf_path: "urdf/panda_mujoco_kinematics.urdf"
xml_path: "envs/panda_pick_place.xml"

# Number of parallel environments to run for data collection.
# This should be <= the number of CPU cores you have.
n_envs: 0

# Maximum number of steps per episode. This is a critical parameter for HER
# as it determines the maximum length of a trajectory in the replay buffer.
# A value of 200-250 is a good balance for this task.
max_episode_steps: 500


# ===================================================================
# 4. RL ALGORITHM HYPERPARAMETERS (DiffusionTQC)
# ===================================================================
# Total number of environment steps to train for.
# Off-policy algorithms are sample-efficient. 1M steps is a solid run.
total_timesteps: 1_000_000

# Size of the replay buffer (in number of transitions).
# Larger is generally better for off-policy learning. 500k is a good size.
buffer_size: 500_000

# Number of steps to collect in the environment before starting training updates.
learning_starts: 10000

# Batch size for the TQC RL update step.
# Should be smaller than `learning_starts`. 256 is a standard value.
rl_batch_size: 256

# Learning rate for the RL actor and critic networks.
rl_lr: 3e-4 # TQC is sensitive to LR, 3e-4 is a common starting point.

# Discount factor for future rewards.
gamma: 0.98


# ===================================================================
# 5. AUXILIARY LOSS CONFIGURATION (Advantage-Weighted BC)
# ===================================================================
# Batch size for the auxiliary BC loss update step.
# This can be the same as or different from the RL batch size.
bc_batch_size: 256

# Number of parallel workers for the offline expert data loader.
bc_num_workers: 4

# Weight (lambda) for the Advantage-Weighted BC loss.
# This controls how strongly the policy is regularized towards expert actions.
# A small value (0.05 - 0.2) is typical for fine-tuning.
lambda_bc: 0.1

# A clamp for the advantage weights to prevent instability from outlier Q-values.
bc_clip: 100.0


# ===================================================================
# 6. HINDSIGHT EXPERIENCE REPLAY (HER) CONFIGURATION
# ===================================================================
# Number of "virtual" successful goals to sample for each real transition.
# 4 is the standard value from the original HER paper.
her_n_sampled_goal: 4

# Strategy for sampling virtual goals. 'future' is the most effective strategy.
her_strategy: "future"


# ===================================================================
# 7. LOGGING & CHECKPOINTING
# ===================================================================
# How often (in total environment steps) to save a checkpoint.
save_freq: 50000

# Verbosity level for Stable Baselines3 (1 for progress bars, 2 for debug).
verbose: 1