# FILE: configs/finetune_rl_config.yaml
#
# Definitive, State-of-the-Art Hydra Configuration for the Final train_rl.py (TD3+BC)
# ---

# Hydra specific settings
hydra:
  run:
    dir: outputs/rl_finetune/${now:%Y-%m-%d}/${now:%H-%M-%S}

# ===================================================================
# 1. RUN MANAGEMENT & REPRODUCIBILITY
# ===================================================================
seed: 42
device: "cpu" # Change to "cuda" if you have a GPU

# ===================================================================
# 2. REQUIRED PATHS
# ===================================================================
# Path to the pre-trained diffusion policy weights from the pre-training step.
# CRITICAL: UPDATE THIS PATH to point to your `best.pth` or `last.pth` file.
pretrained_policy_path: "C:/Users/Hellx/Documents/Programming/python/Project/dgpo/outputs/diffusion_pretrain/v1/2025-10-25/00-16-18/checkpoints/backup/backup_epoch_19.pth"

# Path to the offline expert dataset. This is used for the "+BC" loss.
# CRITICAL: UPDATE THIS to be your main expert dataset.
dataset:
  path: "C:/Users/Hellx/Documents/Programming/python/Project/dgpo/data/validation/sota_dataset/expert_validation_run_99914b93.lmdb"
  num_workers: 0 # For Windows, it's often safer to set this to 0.

# ===================================================================
# 3. ENVIRONMENT CONFIGURATION
# ===================================================================
environment:
  xml_path: "envs/panda_pick_place.xml"
  
  # Number of parallel environments. Set to 1 for a simple test run.
  # Increase for faster data collection if you have multiple CPU cores.
  n_envs: 2

  max_episode_steps: 500
  


# ===================================================================
# 4. MODEL ARCHITECTURE (Must match the pre-trained model)
# ===================================================================
model:
  observation_horizon: 2
  action_horizon: 8
  action_dim: 8
  image_feat_dim: 128             # REDUCED: Smaller feature dimension from ResNet.
  d_model: 128                  # REDUCED: Dramatically reduces Transformer size and complexity.
  denoiser_layers: 4            # REDUCED: Fewer layers means faster forward/backward passes.
  denoiser_heads: 4              # REDUCED: Fewer attention calculations.
  proprio_dim: 22 
# ===================================================================
# 5. DIFFUSION SCHEDULER (Must match the pre-trained model)
# ===================================================================
scheduler:
  schedule: "cosine"
  timesteps: 100
  beta_start: 1.0e-4
  beta_end: 0.02

# ===================================================================
# 6. RL ALGORITHM (TD3+BC)
# ===================================================================
training:
  # Total number of environment steps to train for.
  # For a quick smoke test, use a small number like 2000.
  # For a real run, 200,000 to 1,000,000 is a good range.
  total_timesteps: 200000
  curriculum_total_episodes: 2000
  gradient_accumulation_steps: 8
  use_torch_compile: false
  use_reweighted_bc_actor_loss: true 


rl_algorithm:
  buffer_size: 12000 
  learning_starts: 1 # Collect 3000 steps of experience before the first update.
  batch_size: 128
  gamma: 0.98         # Discount factor
  tau: 0.005          # Soft update factor for target networks

  # TD3-specific parameters
  policy_delay: 4               # Update actor every 2 critic updates
  policy_noise: 0.2             # Noise added to target policy actions
  noise_clip: 0.5               # Clip for target policy noise
  exploration_noise: 0.1        # Std of Gaussian noise added to actions for exploration
  
  # NEW SOTA Parameter for Diffusion Actor
  # Controls how strongly the actor adheres to the learned distribution.
  # A value between 1.0 (no guidance) and 2.0 is a good starting point.
  guidance_scale: 1.5
  sampling_steps: 1  #it was 4 before
  critic_net_arch: [512, 512]     # Hidden layers for the Q-networks
  use_critic_layernorm: true        # Enable/disable LayerNorm in critic MLPs
  critic_use_last_feature: false    # If true, use last obs feature. If false, average over history.
  actor_loss_beta: 10.0

# ===================================================================
# 7. OPTIMIZER
# ===================================================================
optimizer:
  actor_lr: 1.0e-4
  critic_lr: 3.0e-4
  actor_weight_decay: 1.0e-4
  critic_weight_decay: 1.0e-4
  # NEW: Gradient clipping for training stability
  actor_grad_clip_norm: 1.0   # Recommended value to prevent explosions
  critic_grad_clip_norm: null # Typically not needed for critic, but can be set to 1.0
# ===================================================================
# 8. LOGGING & EVALUATION
# ===================================================================
logging:
  use_wandb: false
  wandb_project: "dgpo_rl_finetune_v1"
  wandb_run_name: null
  
  # How often to log training metrics (in total environment steps)
  log_interval_steps: 800
  
  # How often to run the evaluation loop (in total environment steps)
  eval_freq: 3000
  
  # Number of episodes to run during each evaluation
  n_eval_episodes: 1 #3
  
  # How often to save a video during evaluation (e.g., every 1st evaluation)
  video_log_freq: 3
  video_fps: 20


# learning_starts , n_eval_episodes = 3 , sampling_steps = 4 initially
# policy_delay: 4 # Increased from 2 , gradient_accumulation_steps: 4 # Increased from 1, critic_net_arch: [128, 128] # Reduced from [512, 512]