# FILE: configs/finetune_rl_config.yaml
#
# Definitive, State-of-the-Art Hydra Configuration for the Final train_rl.py (TD3+BC)
# ---

# Hydra specific settings
hydra:
  run:
    dir: outputs/rl_finetune/${now:%Y-%m-%d}/${now:%H-%M-%S}

# ===================================================================
# 1. RUN MANAGEMENT & REPRODUCIBILITY
# ===================================================================
seed: 42
device: "cpu" # Change to "cuda" if you have a GPU

# ===================================================================
# 2. REQUIRED PATHS
# ===================================================================
# Path to the pre-trained diffusion policy weights from the pre-training step.
# CRITICAL: UPDATE THIS PATH to point to your `best.pth` or `last.pth` file.
pretrained_policy_path: "notes/checkpoints/best.pth"

# Path to the offline expert dataset. This is used for the "+BC" loss.
# CRITICAL: UPDATE THIS to be your main expert dataset.
dataset:
  path: "C:/Users/Hellx/Documents/Programming/python/Project/dgpo/data/demos/expert_expert_run_v1_20k_samples_086fea9add4358a2b0fe91deaa115372.lmdb"
  num_workers: 0 # For Windows, it's often safer to set this to 0.

# ===================================================================
# 3. ENVIRONMENT CONFIGURATION
# ===================================================================
environment:
  xml_path: "envs/panda_pick_place.xml"
  
  # Number of parallel environments. Set to 1 for a simple test run.
  # Increase for faster data collection if you have multiple CPU cores.
  n_envs: 1
  


# ===================================================================
# 4. MODEL ARCHITECTURE (Must match the pre-trained model)
# ===================================================================
model:
  observation_horizon: 2
  action_horizon: 8
  action_dim: 8
  image_feat_dim: 256
  d_model: 256
  denoiser_layers: 6
  denoiser_heads: 8

# ===================================================================
# 5. DIFFUSION SCHEDULER (Must match the pre-trained model)
# ===================================================================
scheduler:
  schedule_type: "cosine"
  timesteps: 100
  beta_start: 1.0e-4
  beta_end: 0.02

# ===================================================================
# 6. RL ALGORITHM (TD3+BC)
# ===================================================================
training:
  # Total number of environment steps to train for.
  # For a quick smoke test, use a small number like 2000.
  # For a real run, 200,000 to 1,000,000 is a good range.
  total_timesteps: 2000
  curriculum_total_episodes: 2000

rl_algorithm:
  buffer_size: 200_000
  learning_starts: 1000 # Collect 1000 steps of experience before the first update.
  batch_size: 256
  gamma: 0.98         # Discount factor
  tau: 0.005          # Soft update factor for target networks

  # TD3-specific parameters
  policy_delay: 2               # Update actor every 2 critic updates
  policy_noise: 0.2             # Noise added to target policy actions
  noise_clip: 0.5               # Clip for target policy noise
  exploration_noise: 0.1        # Std of Gaussian noise added to actions for exploration
  
  # NEW SOTA Parameter for Diffusion Actor
  # Controls how strongly the actor adheres to the learned distribution.
  # A value between 1.0 (no guidance) and 2.0 is a good starting point.
  guidance_scale: 1.5

# ===================================================================
# 7. OPTIMIZER
# ===================================================================
optimizer:
  actor_lr: 1.0e-4
  critic_lr: 3.0e-4
  
# ===================================================================
# 8. LOGGING & EVALUATION
# ===================================================================
logging:
  use_wandb: false
  wandb_project: "dgpo_rl_finetune"
  wandb_run_name: null
  
  # How often to log training metrics (in total environment steps)
  log_interval_steps: 100
  
  # How often to run the evaluation loop (in total environment steps)
  eval_freq: 1000
  
  # Number of episodes to run during each evaluation
  n_eval_episodes: 5
  
  # How often to save a video during evaluation (e.g., every 1st evaluation)
  video_log_freq: 1