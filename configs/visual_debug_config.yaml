# @package _global_

# --- Path to the checkpoint you want to visually debug ---
checkpoint_path: "C:/Users/Hellx/Documents/Programming/python/Project/redhot/notes/checkpoints/v1/backup_epoch_39.ckpt"

# --- Which episode from the training dataset to use for the test ---
# Pick an index from 0 to (total_episodes - 1)
episode_id_to_test: "ep_000015"

# --- Inference parameters for the model ---
inference_steps: 20

# Top-level seed for reproducibility.
seed: 42

# ==============================================================================
# The following sections are copied directly from your training config.
# They are REQUIRED for the script to load the model and environment correctly.
# Do NOT modify them unless you have changed your model architecture.
# ==============================================================================

# --- Environment Configuration ---
# Needed to initialize the PandaEnv.
env:
  xml_path: "envs/panda_pick_place.xml"

# --- Dataset Configuration ---
# Needed to find and load the episode data.
dataset:
  train_path: "C:/Users/Hellx/Documents/Programming/python/Project/redhot/data/validation/validation_dataset.lmdb"
  val_path: "C:/Users/Hellx/Documents/Programming/python/Project/redhot/data/validation/validation_dataset.lmdb"
  num_workers: 1

# --- Model Architecture (CRITICAL) ---
# This entire block is required for the LightningModule to reconstruct
# the model in memory before it can load the saved weights.
model:
  sequencer_cfg:
    vision_backbone_model: "google/siglip-base-patch16-224"
    num_task_phases: 5
    fusion_transformer_layers: 4
    fusion_transformer_heads: 8
    subgoal_dim: 768
    proprio_dim: ${model.executor_cfg.proprio_dim}

  executor_cfg:
    proprio_dim: 22
    action_dim: 8
    action_horizon: 8
    obs_horizon: 2
    subgoal_dim: 768
    pilot_hidden_dim: 512
    resnet_feature_dim: 256
    denoiser_layers: 6
    denoiser_heads: 8