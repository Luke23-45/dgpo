# FILE: configs/train_vip_c_config.yaml
#
# Definitive, SOTA, Production-Ready Hydra Configuration for train_vip_c.py
#

# Allows Hydra to find this file as the primary config
defaults:
  - _self_

# ===================================================================
# 1. GLOBAL SETTINGS
# ===================================================================
seed: 42
project_name: "vip_c_training"

# ===================================================================
# 2. MODEL CONFIGURATION (`model`)
# ===================================================================
model:
  planner_cfg:
    vision_backbone_model: "google/siglip-base-patch16-224"
    num_task_phases: 5
    fusion_transformer_layers: 4
    fusion_transformer_heads: 12
    implicit_subgoal_dim: 128
    
  controller_cfg:
    action_dim: 8       # MUST match your dataset
    proprio_dim: 22     # MUST match your dataset
    action_horizon: 8
    obs_horizon: 2
    controller_hidden_dim: 512
    resnet_feature_dim: 256
    denoiser_layers: 6
    denoiser_heads: 8
    implicit_subgoal_dim: 128

# ===================================================================
# 3. SCHEDULER CONFIGURATION (`scheduler`)
# ===================================================================
scheduler:
  timesteps: 100
  beta_schedule: "squaredcos_cap_v2" # A modern, stable schedule
  beta_start: 0.0001
  beta_end: 0.02

# ===================================================================
# 4. DATASET & DATALOADER CONFIGURATION (`dataset`)
# ===================================================================
dataset:
  # train_path: "/content/drive/MyDrive/pda/data/training/training_dataset.lmdb"
  train_path: "/content/drive/MyDrive/pda/data/validation/validation_dataset.lmdb"
  val_path: "/content/drive/MyDrive/pda/data/validation/validation_dataset.lmdb"
  # train_path: "C:/Users/Hellx/Documents/Programming/python/Project/redhot/data/validation/validation_dataset.lmdb"
  # val_path: "C:/Users/Hellx/Documents/Programming/python/Project/redhot/data/validation/validation_dataset.lmdb"
  num_workers: 2

env:
  # --- DEFINITIVE FIX ---
  # Use a Hydra resolver to construct an absolute path from the
  # original working directory. This makes the path robust to where
  # Hydra runs the script.
  xml_path: "${hydra:runtime.cwd}/envs/panda_pick_place.xml"

resilience:
  # Enable periodic, failsafe backups. HIGHLY recommended.
  use_per_epoch_backup: true
  
  # Directory to save the periodic backup checkpoints.
  # Use `null` to use a default "backups" folder in the run's output directory.
  backup_dir: "/content/drive/MyDrive/pda/models/v1" # Or your local path
  
  # Save a backup every N epochs.
  backup_every_n_epochs: 8

# ===================================================================
# 5. CORE TRAINING LOOP CONFIGURATION (`training`)
# ===================================================================
training:
  batch_size: 32
  val_batch_size: 32
  ema_decay: 0.999
  
  # The crucial weights for the dual-objective loss
  loss_weights:
    planner: 1.0
    controller: 0.5
    
  # Checkpointing configuration
  checkpoint_monitor: "val/loss_planner_raw" # Monitor the key planner metric
  save_top_k: 3
  
  # Path to a .ckpt file to resume from (e.g., "outputs/.../checkpoints/last.ckpt")
  # Set to null for a fresh run.
  # resume_from_checkpoint: "/content/drive/MyDrive/pda/Models/backup_epoch_0.ckpt"
  resume_from_checkpoint: null

  # SWA configuration
  use_swa: false
  swa_lrs: 1e-5

# ===================================================================
# 6. VALIDATION CONFIGURATION (`validation`)
# ===================================================================
validation:
  # Run the expensive qualitative image logging every N epochs
  run_qualitative_every_n_epoch: 30

# ===================================================================
# 7. OPTIMIZER CONFIGURATION (`optimizer`)
# ===================================================================
optimizer:
  lr: 1e-4
  weight_decay: 1e-6
  warmup_percentage: 0.05 # 5% of total steps will be warmup

# ===================================================================
# 8. PYTORCH LIGHTNING TRAINER CONFIGURATION (`trainer`)
# ===================================================================
trainer:
  accelerator: "cuda"
  devices: [0] # Or [0, 1] for multi-GPU

  # devices: 1  # this is for cpu
  max_epochs: 1000
  precision: "16-mixed" # Use "bf16-mixed" on A100/H100 GPUs
  
  # Log validation metrics every N epochs
  check_val_every_n_epoch: 130
  
  # Accumulate gradients to simulate a larger batch size
  # Effective batch size = batch_size * accumulate_grad_batches
  accumulate_grad_batches: 2
  
  # Gradient clipping for stability
  gradient_clip_val: 1.0

# ===================================================================
# 9. LOGGING CONFIGURATION (`logging`)
# ===================================================================
logging:
  use_wandb: true
  wandb_project: ${project_name} # Use the global project name
  wandb_run_name: null # Let W&B generate a name, or specify one
  wandb_mode: "offline" # "online", "offline", or "disabled"

  log_grad_freq: 500 # Log gradients every 500 steps
  progress_bar_refresh_rate: 10


