# FILE: configs/evaluate_vip_c_config.yaml
#
# Definitive, SOTA, Production-Ready Hydra Configuration for evaluate_vip_c.py
# This file provides all necessary parameters to run a robust, diagnostic-rich
# evaluation of a trained ViP-C model.
#

# Allows Hydra to find this file as the primary config.
# We explicitly do NOT include defaults from the training config to keep
# this evaluation config self-contained and unambiguous.
defaults:
  - _self_

# ===================================================================
# 1. CORE EVALUATION PARAMETERS
# ===================================================================

# [REQUIRED] The full path to the PyTorch Lightning checkpoint (.ckpt) file.
# This is the single most important parameter.
# Example: "outputs/2025-11-05/10-30-00/checkpoints/best-epoch=150.ckpt"
checkpoint_path: "C:/Users/Hellx/Documents/Programming/python/Project/redhot/notes/checkpoints/backup_epoch_32.ckpt"

# The path where the output evaluation video will be saved.
output_video: "evaluation_videos/vip_c_eval.mp4"

# The master seed for the evaluation run. Using a fixed seed ensures that
# the environment resets are deterministic, allowing for fair, reproducible
# comparisons between different model checkpoints.
seed: 43

# The total number of episodes to run for this evaluation.
# A value between 5 and 10 is good for a quick qualitative check.
num_episodes: 1

# ===================================================================
# 2. INFERENCE & SAMPLING PARAMETERS (`inference`)
# ===================================================================
# These parameters control the behavior of the diffusion model's sampling loop.
# They do NOT need to match the training config. In fact, fewer steps are
# often used for faster inference.

inference_steps: 20 # Number of DDPM/DDIM denoising steps. A value between 10-50 is typical.

# NOTE: The ViP-C model, as implemented, does not use Classifier-Free Guidance (CFG).
# The `act` method does not have parameters for guidance scales. If you were
# to add CFG in the future, you would add those parameters here.
# guidance_scale_plan: 7.5
# guidance_scale_obs: 1.5

# ===================================================================
# 3. ENVIRONMENT PARAMETERS (`env`)
# ===================================================================
# This section is NOT needed for the evaluation script, because the
# `xml_path` is loaded from the training hyperparameters saved within the
# checkpoint file itself. This is a robust design that prevents mismatches.
# However, if you ever needed to override it, you would add it here:
# env:
#   xml_path: "envs/panda_pick_place.xml"