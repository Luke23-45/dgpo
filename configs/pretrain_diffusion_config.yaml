# FINAL CONFIGURATION (ITERATION 5)
# Optimized for Model Performance on a High-RAM CPU System
# ---
hydra:
  run:
    dir: outputs/diffusion_pretrain/v1/${now:%Y-%m-%d}/${now:%H-%M-%S}

# ===================================================================
# 1. RUN MANAGEMENT & REPRODUCIBILITY
# ===================================================================
seed: 42
device: "cuda"
resume_checkpoint: "/content/drive/MyDrive/pda/Models/best.pth"

# ===================================================================
# 2. LOGGING
# ===================================================================
logging:
  use_wandb: false
  wandb_project: "dgpo_diffusion_pretrain"
  log_interval_steps: 100       # Log training metrics every 100 steps.
  val_interval_epochs: 3       # Run a full validation every 20 epochs. A good balance for a long run.

# ===================================================================
# 3. DATASET & DATALOADING
# ===================================================================
dataset:
  path: "/content/drive/MyDrive/pda/data/shard_001/expert_training_run_99914b93_part001.lmdb"      # Replace with actual path
  val_path: "/content/drive/MyDrive/pda/data/validation/sota_dataset/expert_validation_run_99914b93.lmdb"   # Replace with actual path
  batch_size: 128               # Maximized for 16GB RAM to get stable gradients.
  num_workers: 2                # Use 4 parallel workers to hide data loading latency. Set to 0 if errors occur.

# ===================================================================
# 4. MODEL ARCHITECTURE
# ===================================================================
# model:
#   observation_horizon: 2
#   action_horizon: 8
#   action_dim: 8
#   image_feat_dim: 256
#   d_model: 256                  # Full-sized model for maximum representational capacity.
#   denoiser_layers: 6
#   denoiser_heads: 8
model:
  observation_horizon: 2
  action_horizon: 8
  action_dim: 8
  image_feat_dim: 128             # REDUCED: Smaller feature dimension from ResNet.
  d_model: 128                  # REDUCED: Dramatically reduces Transformer size and complexity.
  denoiser_layers: 4            # REDUCED: Fewer layers means faster forward/backward passes.
  denoiser_heads: 4              # REDUCED: Fewer attention calculations.
# ===================================================================
# 5. DIFFUSION SCHEDULER
# ===================================================================
scheduler:
  schedule_type: "cosine"
  timesteps: 100
  beta_start: 1.0e-4
  beta_end: 0.02

# ===================================================================
# 6. OPTIMIZER & TRAINING
# ===================================================================
optimizer:
  lr: 2.0e-4                    # Scaled learning rate to match the larger batch size.
  weight_decay: 1.0e-4          # Standard L2 regularization to combat overfitting.
  grad_clip_norm: 1.0

training:
  epochs: 1000                  # A sufficient number of epochs for full convergence on this dataset size.
  use_amp: false                # Must be false for CPU.
  ema_decay: 0.999              # Standard EMA decay for stable model weights.
  cfg_p_uncond: 0.15              # Increased dropout of conditioning for better CFG performance.

# ===================================================================
# 7. VALIDATION
# ===================================================================
validation:
  guidance_scale: 1.5
  sampling_steps: 50