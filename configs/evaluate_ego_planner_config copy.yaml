# FILE: configs/evaluate_ego_planner_config.yaml
# Hydra Configuration for SOTA Ego-Planner Evaluation

# --- Primary Settings (MUST BE EDITED BY USER) ---
checkpoint_path: "C:/Users/Hellx/Documents/Programming/python/Project/redhot/notes/checkpoints/backup_epoch_74.ckpt"
dataset:
  path: "C:/Users/Hellx/Documents/Programming/python/Project/redhot/data/validations/expert_validation_run_99914b93.lmdb"

# --- Evaluation Control ---
episode_indices: [] # List of specific episode indices to evaluate, e.g., [0, 5, 10]. If empty, evaluates `max_episodes_to_eval` from the start.
max_episodes_to_eval: 1 # How many videos to generate if `episode_indices` is empty.
video_fps: 15
seed: 42
device: "cpu"

# --- Model & Scheduler Configuration ---
# This section MUST EXACTLY MATCH the configuration used to train the model checkpoint.
# Copy it from your training config file.
model:
  action_dim: 8
  proprio_dim: 22
  action_horizon: 8
  obs_horizon: 2
  vision_backbone_model: "google/siglip-base-patch16-224"
  vision_feature_dim: 768
  fusion_transformer_layers: 4
  fusion_transformer_heads: 8
  resnet_feature_dim: 256
  pilot_d_model: 512
  denoiser_layers: 6
  denoiser_heads: 8

scheduler:
  beta_start: 1.0e-4
  beta_end: 0.02
  schedule: cosine
  timesteps: 100
env:
  # --- DEFINITIVE FIX ---
  # Use a Hydra resolver to construct an absolute path from the
  # original working directory. This makes the path robust to where
  # Hydra runs the script.
  xml_path: "${hydra:runtime.cwd}/envs/panda_pick_place.xml"
# --- Inference Parameters ---
inference:
  sampling_steps: 20  # Number of DDIM steps for generation
  guidance_scale_plan: 1.5  # CFG scale for the strategic plan
  guidance_scale_obs: 1.5   # CFG scale for the tactical observations

# --- Hydra Settings ---
hydra:
  run:
    dir: outputs/ego_planner_evaluations/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: true