seed: 42
model:
  proprio_dim: 22
  num_task_phases: 5
  vision_backbone_model: google/siglip-base-patch16-224
  vision_feature_dim: 768
  fusion_transformer_layers: 4
  fusion_transformer_heads: 8
  dim_feedforward_ratio: 4
  dropout: 0.1
  obs_horizon: 1
dataset:
  train_path: C:/Users/Hellx/Documents/Programming/python/Project/redhot/data/training_ready/training.lmdb
  val_path: C:/Users/Hellx/Documents/Programming/python/Project/redhot/data/training_ready/training.lmdb
  num_workers: 1
  use_aug: false
training:
  batch_size: 64
  val_batch_size: 64
  backup_every_n_epochs: 3
  max_epochs: 100
  gradient_clip_val: 1.0
  val_check_interval: 1.0
  awr_temperature: 0.5
  awr_max_weight: 20.0
  loss_weights:
    lambda_gripper: 0.1
  resume_from_checkpoint: null
optimizer:
  lr: 0.0001
  weight_decay: 1.0e-06
  min_lr: 1.0e-06
  warmup_percentage: 0.05
trainer:
  accelerator: cpu
  devices: 1
  precision: 16-mixed
  accumulate_grad_batches: 1
  log_every_n_steps: 10
  num_sanity_val_steps: 2
logging:
  use_wandb: true
  wandb_project: AWSP-v1
  wandb_mode: offline
  run_name: awsp_siglip_phase_aware
  log_grad_freq: 500
