seed: 42
project_name: vip_c_training
model:
  planner_cfg:
    vision_backbone_model: google/siglip-base-patch16-224
    num_task_phases: 5
    fusion_transformer_layers: 4
    fusion_transformer_heads: 12
  controller_cfg:
    action_dim: 8
    proprio_dim: 22
    action_horizon: 8
    obs_horizon: 2
    controller_hidden_dim: 512
    resnet_feature_dim: 256
    denoiser_layers: 6
    denoiser_heads: 8
scheduler:
  timesteps: 100
  beta_schedule: squaredcos_cap_v2
  beta_start: 0.0001
  beta_end: 0.02
dataset:
  train_path: C:/Users/Hellx/Documents/Programming/python/Project/redhot/data/validation/validation_dataset.lmdb
  val_path: C:/Users/Hellx/Documents/Programming/python/Project/redhot/data/validation/validation_dataset.lmdb
  num_workers: 2
resilience:
  use_per_epoch_backup: true
  backup_dir: /content/drive/MyDrive/pda/models/v1
  backup_every_n_epochs: 1
training:
  batch_size: 32
  val_batch_size: 32
  ema_decay: 0.999
  loss_weights:
    planner: 1.0
    controller: 0.5
  checkpoint_monitor: val/loss_planner_raw
  save_top_k: 3
  resume_from_checkpoint: notes/checkpoints/backup_epoch_0.ckpt
  use_swa: false
  swa_lrs: 1.0e-05
validation:
  run_qualitative_every_n_epoch: 30
optimizer:
  lr: 0.0001
  weight_decay: 1.0e-06
  warmup_percentage: 0.05
trainer:
  accelerator: cpu
  devices: 1
  max_epochs: 1000
  precision: 16-mixed
  check_val_every_n_epoch: 130
  accumulate_grad_batches: 2
  gradient_clip_val: 1.0
logging:
  use_wandb: true
  wandb_project: ${project_name}
  wandb_run_name: null
  wandb_mode: offline
  log_grad_freq: 500
  progress_bar_refresh_rate: 10
